apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: enterprise-monitor
spec:
 type: {{ .Values.service.type }}
 selector:
   app: enterprise-monitor
 ports:
   - name: http
     protocol: TCP
     port: {{ .Values.service.port }}
     targetPort: {{ .Value.service.targetPort }}
