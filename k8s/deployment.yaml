apiVersion: v1
kind: Namespace
metadata:
  name: sap-btp-monitor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sap-btp-enterprise-monitor
  namespace: sap-btp-monitor
  labels:
    app: sap-btp-enterprise-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sap-btp-enterprise-monitor
  template:
    metadata:
      labels:
        app: sap-btp-enterprise-monitor
    spec:
      containers:
        - name: enterprise-monitor
          image: ghcr.io/pr8600/sap-btp-enterprise-monitor:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /ready
              port: http

            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"