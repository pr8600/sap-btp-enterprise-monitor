apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-monitor-ingress
  namespace: sap-btp-monitor
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sap-btp-enterprise-monitor
                port:
                  number: 80
